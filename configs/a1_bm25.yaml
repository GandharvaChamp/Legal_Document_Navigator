run_name: a1_bm25
seed: 42

data:
  corpus_dir: data/raw/corpus
  benchmarks_dir: data/raw/benchmarks
  split: dev

chunking:
  method: recursive
  chunk_size: 512
  overlap: 64

embedding:                       # not used by BM25 (kept so the config loads)
  model: BAAI/bge-base-en-v1.5
  query_variant: full_instr

retrieval:
  type: bm25
  top_k: 10
  depth: 100
  bm25_k1: 1.5
  bm25_b: 0.75

rerank:
  enabled: false

generation:
  model: TBD
  temperature: 0